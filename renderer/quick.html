<!doctype html>
<html lang="en">
<head>
  <title>Quick Access</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'none'; connect-src ipc: http://ipc.localhost;" />
  <link rel="stylesheet" href="quick.css" />
</head>
<body>
  <main class="panel" id="panel" aria-label="VaultOS Quick Access">
    <div class="bar">
      <svg class="glass" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search VaultOS" aria-label="Search VaultOS" aria-controls="results" aria-autocomplete="list" />
      <span class="badge" id="state">VaultOS</span>
    </div>
    <ul id="results" role="listbox" aria-label="Results"></ul>
    <section id="locked" hidden>
      <p class="title">VaultOS is locked</p>
      <p class="sub">Unlock to search and copy. Lock, or closing the VaultOS window, locks it again.</p>
      <div class="unlock">
        <input id="pw" type="password" placeholder="Master password" aria-label="Master password" />
        <button id="unlock" class="primary">Unlock</button>
        <button id="touch" hidden>Touch ID</button>
      </div>
    </section>
    <section id="confirm" hidden>
      <p class="title">Confirm it's you</p>
      <p class="sub" id="confirm-why"></p>
      <div class="unlock">
        <input id="confirm-pw" type="password" placeholder="Master password" aria-label="Master password" />
        <button id="confirm-ok" class="primary">Confirm</button>
        <button id="confirm-cancel">Cancel</button>
      </div>
    </section>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <footer id="hints">
      <span><kbd>⏎</kbd> Copy</span><span><kbd>⌘C</kbd> Username</span><span><kbd>⌥⏎</kbd> Code</span><span><kbd>⌘O</kbd> Open URL</span><span><kbd>⌘⏎</kbd> Show in VaultOS</span><span><kbd>esc</kbd> Close</span>
    </footer>
  </main>
  <script src="tauri-bridge.js"></script>
  <script src="quick.js"></script>
</body>
</html>

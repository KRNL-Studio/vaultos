name: Publish preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (for example v0.3.0-preview.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    steps:
      # Provenance names the commit the workflow runs from, so that has to be the tag's.
      - name: Run from the tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || { echo "::error::Run this workflow from the tag $RELEASE_TAG (Use workflow from > Tags)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate tag and preview version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'const p=require("./package.json");if(!/^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$/.test(process.env.RELEASE_TAG)||process.env.RELEASE_TAG!=="v"+p.version)process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: cargo test --workspace --locked
      - run: npm run test:desktop
      - run: npm run dist:mac
        env:
          VAULTOS_ARCH: ${{ matrix.arch }}
      - run: node scripts/test-packaged.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      # Provenance names the commit the workflow runs from, so that has to be the tag's.
      - name: Run from the tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || { echo "::error::Run this workflow from the tag $RELEASE_TAG (Use workflow from > Tags)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate tag and preview version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'const p=require("./package.json");if(!/^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$/.test(process.env.RELEASE_TAG)||process.env.RELEASE_TAG!=="v"+p.version)process.exit(1)'
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: cargo test --workspace --locked
      - run: npm run dist:linux
        env:
          VAULTOS_ARCH: x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error
  publish:
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore-signed build provenance for each archive and SBOM (`gh attestation verify`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          merge-multiple: true
          path: artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.cdx.json
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --prerelease --title "VaultOS $RELEASE_TAG — macOS and Linux preview" --notes-file docs/RELEASE_NOTES.md

[package]
name = "vaultos-mcp"
description = "VaultOS MCP bridge: the agent tools over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "vaultos-mcp"
path = "src/main.rs"

[dependencies]
vaultos-client = { path = "../vaultos-client" }
vaultos-core = { path = "../vaultos-core" }
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
vaultos-daemon = { path = "../vaultos-daemon" }

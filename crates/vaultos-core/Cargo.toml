[package]
name = "vaultos-core"
description = "VaultOS vault format, cryptography and store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
miniz_oxide = "0.8"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = { version = "0.10", features = ["asm"] }  # hardware SHA-256 (ARMv8, SHA-NI)
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bench]]
name = "store"
harness = false

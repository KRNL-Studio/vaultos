[package]
name = "vaultos-daemon"
description = "VaultOS daemon: the agent API for one vault over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "vaultosd"
path = "src/main.rs"

[dependencies]
vaultos-core = { path = "../vaultos-core" }
vaultos-sync = { path = "../vaultos-sync" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "macros", "sync"] }

[dev-dependencies]
tempfile = "3"
vaultos-client = { path = "../vaultos-client" }
